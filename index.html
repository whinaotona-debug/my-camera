<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIカメラ ＆ チャット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; overflow: hidden; }
        .tsukkomi-text {
            color: #fff; font-size: 2rem; font-weight: 900; text-align: center;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 0 4px 10px rgba(0,0,0,0.6);
            line-height: 1.3;
        }
        .loader { border: 4px solid #334155; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- ヘッダー -->
    <header class="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700 shadow-md z-10">
        <h1 class="text-xl font-black italic text-blue-400">AIカメラ</h1>
        <button id="openChat" class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg active:scale-90 transition">💬</button>
    </header>

    <!-- メイン：カメラ -->
    <main id="cameraView" class="flex-grow flex flex-col items-center justify-center p-4 gap-4 overflow-y-auto">
        <div class="relative w-full max-w-sm aspect-[4/5] bg-slate-900 rounded-2xl overflow-hidden border-2 border-slate-700 flex flex-col items-center justify-center shadow-2xl">
            <img id="preview" class="hidden absolute inset-0 w-full h-full object-cover">
            <div id="placeholder" class="text-slate-500 text-center">📸 写真を撮影または選択</div>
            
            <div id="overlay" class="absolute inset-0 flex items-end justify-center p-8 hidden z-10">
                <p id="aiOutput" class="tsukkomi-text"></p>
            </div>

            <div id="loading" class="absolute inset-0 bg-slate-900/80 hidden flex-col items-center justify-center z-20">
                <div class="loader mb-2"></div>
                <p class="text-blue-400 font-bold">AIが解析中...</p>
            </div>
        </div>

        <div class="w-full max-w-sm flex flex-col gap-3">
            
            <!-- 【改良】ボタンを2つに分けました -->
            <div class="flex gap-2">
                <!-- カメラ起動ボタン -->
                <label class="flex-1 bg-white text-slate-900 text-center py-3 rounded-xl font-bold cursor-pointer active:scale-95 transition shadow-lg">
                    📸 撮る
                    <!-- capture="environment" があるとカメラが直接起動します -->
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                </label>
                
                <!-- ライブラリを開くボタン -->
                <label class="flex-1 bg-slate-200 text-slate-900 text-center py-3 rounded-xl font-bold cursor-pointer active:scale-95 transition shadow-lg">
                    🖼 選ぶ
                    <!-- capture属性を消すと写真フォルダが開きます -->
                    <input type="file" id="galleryInput" accept="image/*" class="hidden">
                </label>
            </div>

            <button id="runBtn" disabled class="bg-blue-600 disabled:bg-slate-700 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition mt-1">
                写真でひとこと
            </button>
        </div>
    </main>

    <!-- モーダル：チャット -->
    <div id="chatModal" class="fixed inset-0 bg-slate-900 z-50 flex flex-col hidden">
        <div class="p-4 bg-slate-800 flex justify-between items-center border-b border-slate-700">
            <span class="font-bold">AIとチャット</span>
            <button id="closeChat" class="text-2xl p-2">✕</button>
        </div>
        <div id="chatLog" class="flex-grow p-4 overflow-y-auto flex flex-col gap-4 bg-slate-950">
            <div class="bg-slate-800 p-3 rounded-xl mr-auto max-w-[80%]">こんにちは！何でも聞いてくださいね。</div>
        </div>
        <div class="p-4 bg-slate-800 flex gap-2 border-t border-slate-700">
            <input type="text" id="chatInput" placeholder="メッセージを入力..." class="flex-grow bg-slate-700 p-3 rounded-xl outline-none text-white">
            <button id="sendBtn" class="bg-blue-600 px-6 py-2 rounded-xl font-bold">送信</button>
        </div>
    </div>

    <script>
        const API_KEY = 'AQ.Ab8RN6IKCw8iAfjBB8bgpWGLpxsSXWmHMLA6OZuUyn4Z1f7P_A';
        let modelPath = "";

        // 1. 使えるモデルを自動で取得
        async function init() {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`);
                const data = await res.json();
                const models = data.models || [];
                const target = models.find(m => m.name.includes('gemini-1.5-flash')) || models[0];
                modelPath = `https://generativelanguage.googleapis.com/v1beta/${target.name}:generateContent?key=${API_KEY}`;
            } catch (e) {
                console.error("モデル取得失敗");
            }
        }
        init();

        // 2. 画像処理（カメラとライブラリ共通の処理）
        const cameraInput = document.getElementById('cameraInput');
        const galleryInput = document.getElementById('galleryInput');
        const preview = document.getElementById('preview');
        const runBtn = document.getElementById('runBtn');
        const aiOutput = document.getElementById('aiOutput');
        const loading = document.getElementById('loading');
        let base64Img = "";

        // 写真を選んだときの共通処理
        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (re) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 500; 
                    let w = img.width, h = img.height;
                    if (w > MAX) { h = (h * MAX) / w; w = MAX; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    base64Img = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
                    preview.src = canvas.toDataURL('image/jpeg');
                    preview.classList.remove('hidden');
                    document.getElementById('placeholder').classList.add('hidden');
                    document.getElementById('overlay').classList.add('hidden');
                    runBtn.disabled = false;
                };
                img.src = re.target.result;
            };
            reader.readAsDataURL(file);
            // 連続して同じ写真を選べるようにリセット
            e.target.value = '';
        }

        // カメラもライブラリも、同じ処理を呼び出す
        cameraInput.addEventListener('change', handleImageSelect);
        galleryInput.addEventListener('change', handleImageSelect);

        // 3. カメラツッコミ実行
        runBtn.onclick = async () => {
            if (!modelPath) await init();
            runBtn.disabled = true;
            loading.classList.replace('hidden', 'flex');
            try {
                const res = await fetch(modelPath, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "写真で一言、前置きは不要、写真を使った『秀逸な例え』か『爆笑のセリフ』のどちらかで、1行で15文字以内。" }, { inlineData: { mimeType: "image/jpeg", data: base64Img } }] }]
                    })
                });
                const d = await res.json();
                aiOutput.innerText = d.candidates[0].content.parts[0].text;
                document.getElementById('overlay').classList.remove('hidden');
            } catch (err) {
                alert("解析エラー。もう一度試してね。");
            } finally {
                loading.classList.replace('flex', 'hidden');
                runBtn.disabled = false;
            }
        };

        // 4. チャット機能
        const chatModal = document.getElementById('chatModal');
        const chatLog = document.getElementById('chatLog');
        const chatInput = document.getElementById('chatInput');
        document.getElementById('openChat').onclick = () => chatModal.classList.remove('hidden');
        document.getElementById('closeChat').onclick = () => chatModal.classList.add('hidden');

        async function sendMessage() {
            const txt = chatInput.value.trim();
            if (!txt || !modelPath) return;
            
            const u = document.createElement('div');
            u.className = "flex justify-end";
            u.innerHTML = `<div class="bg-blue-600 p-3 rounded-xl rounded-tr-none max-w-[80%] shadow">${txt}</div>`;
            chatLog.appendChild(u);
            chatInput.value = '';
            chatLog.scrollTop = chatLog.scrollHeight;

            try {
                const res = await fetch(modelPath, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: txt }] }] })
                });
                const d = await res.json();
                const a = document.createElement('div');
                a.className = "flex justify-start";
                a.innerHTML = `<div class="bg-slate-800 p-3 rounded-xl rounded-tl-none max-w-[80%] shadow">${d.candidates[0].content.parts[0].text}</div>`;
                chatLog.appendChild(a);
                chatLog.scrollTop = chatLog.scrollHeight;
            } catch (e) {
                alert("送信エラー");
            }
        }
        document.getElementById('sendBtn').onclick = sendMessage;
        chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
