<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>モノモン・バトル</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
    <style>
        :root { --ink: #2c2c2c; --paper: #f4f4f0; }
        body { font-family: 'Yomogi', cursive; background-color: var(--paper); color: var(--ink); margin: 0; padding: 20px; background-image: linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px); background-size: 20px 20px; }
        h1, h2, h3 { text-align: center; border-bottom: 2px solid var(--ink); border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; padding-bottom: 5px; margin-bottom: 20px; }
        .box { border: 2px solid var(--ink); border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; padding: 15px; margin-bottom: 20px; background: #fff; box-shadow: 3px 3px 0px rgba(0,0,0,0.1); }
        button { font-family: 'Yomogi', cursive; font-size: 1.1rem; color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 15px 225px 15px 255px/255px 15px 225px 15px; padding: 10px 20px; margin: 5px; cursor: pointer; font-weight: bold; }
        button:active { background: var(--ink); color: var(--paper); }
        input[type="password"], input[type="text"] { font-family: 'Yomogi', cursive; font-size: 1.2rem; border: none; border-bottom: 2px dashed var(--ink); background: transparent; text-align: center; width: 90%; outline: none; margin-bottom: 10px;}
        .hidden { display: none !important; }
        .status-row { display: flex; justify-content: space-between; border-bottom: 1px dotted #ccc; margin-bottom: 5px;}
        .loading { text-align: center; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
        #battle-log { height: 250px; overflow-y: auto; background: #eef; padding: 10px; font-size: 0.95rem; line-height: 1.5;}
    </style>
</head>
<body>

    <h1>モノモン・バトル</h1>

    <!-- 🔑 APIキー入力画面 -->
    <div id="screen-setup" class="box">
        <h2>初期設定</h2>
        <p style="font-size: 0.9rem;">APIキーを入力してください。<br><small style="color: #d00;">※会社や学校のGoogleアカウントではアクセス拒否(PERMISSION_DENIED)になる場合があります。個人の @gmail.com での取得をおすすめします。</small></p>
        <div style="text-align: center;">
            <input type="password" id="input-api-key" placeholder="APIキーをペースト">
            <br>
            <button onclick="saveApiKey()">冒険を始める</button>
        </div>
    </div>

    <!-- 🏠 ホーム画面 -->
    <div id="screen-home" class="box hidden">
        <h2 id="my-name">キャラ未召喚</h2>
        <div id="my-stats"><p>まだモノを撮影していません。</p></div>
        <p id="my-desc"></p>
        
        <input type="file" id="camera-summon" accept="image/*" capture="environment" class="hidden">
        <input type="file" id="camera-feed" accept="image/*" capture="environment" class="hidden">
        <div style="text-align: center;">
            <button onclick="document.getElementById('camera-summon').click()">モノを撮って召喚</button>
            <button onclick="document.getElementById('camera-feed').click()">メシを撮って育成</button>
            <br><button onclick="showScreen('screen-match')">バトルへ向かう</button>
            <br><br><button onclick="clearApiKey()" style="font-size: 0.8rem; color: #888; border-color: #888;">設定リセット</button>
        </div>
    </div>

    <!-- ⚔️ マッチング画面 -->
    <div id="screen-match" class="box hidden">
        <h2>通信対戦</h2>
        <div style="text-align: center;">
            <button onclick="hostGame()">部屋を作る</button>
            <p>または</p>
            <input type="text" id="join-code" placeholder="コード" maxlength="4" style="width:100px;">
            <button onclick="joinGame()">部屋に入る</button>
            <br><br><button onclick="showScreen('screen-home')">戻る</button>
        </div>
        <h3 id="room-display" class="hidden">部屋コード: <span id="current-code"></span><br><small>対戦相手を待機中...</small></h3>
    </div>

    <!-- 💥 バトル画面 -->
    <div id="screen-battle" class="box hidden">
        <h2>バトル開始</h2>
        <div id="battle-log">対戦相手を待機中...</div>
        <div style="text-align: center;"><button onclick="showScreen('screen-home')">帰還する</button></div>
    </div>

    <div id="loading" class="box hidden loading">AIが解析中...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD3N-JEBeHx88eAfmlora5I2FCpMe9EHM",
            authDomain: "monomon-4d55d.firebaseapp.com",
            projectId: "monomon-4d55d",
            databaseURL: "https://monomon-4d55d-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let myData = JSON.parse(localStorage.getItem("monomon_data")) || null;
        let myApiKey = localStorage.getItem("monomon_apikey") || "";

        window.showScreen = (screenId) => {
            document.querySelectorAll('.box').forEach(el => el.id !== 'loading' && el.classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId === 'screen-home') updateHomeUI();
        };

        if (myApiKey) { showScreen('screen-home'); } else { showScreen('screen-setup'); }

        window.saveApiKey = () => {
            const val = document.getElementById('input-api-key').value.replace(/\s+/g, '');
            if (!val) return alert("キーを入力してください");
            myApiKey = val;
            localStorage.setItem("monomon_apikey", myApiKey);
            showScreen('screen-home');
        };

        window.clearApiKey = () => {
            if(confirm("APIキーやデータを消去してリセットしますか？")) {
                localStorage.removeItem("monomon_apikey");
                localStorage.removeItem("monomon_data");
                location.reload();
            }
        };

        function updateHomeUI() {
            if (myData) {
                document.getElementById('my-name').innerText = myData.name;
                document.getElementById('my-stats').innerHTML = `<div class="status-row"><span>HP</span><span>${myData.hp}</span></div><div class="status-row"><span>ATK</span><span>${myData.atk}</span></div><div class="status-row"><span>DEF</span><span>${myData.def}</span></div>`;
                document.getElementById('my-desc').innerText = myData.desc;
            }
        }

        // ★最新の「gemini-3.5-flash」を呼び出します
        async function callGemini(parts) {
            document.getElementById('loading').classList.remove('hidden');
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${myApiKey}`;
            
            try {
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });
                const data = await res.json();
                document.getElementById('loading').classList.add('hidden');
                
                if (data.error) {
                    if (data.error.status === "PERMISSION_DENIED") {
                        alert("【アクセス拒否エラー】\n会社や学校のGoogleアカウントをお使いの場合、制限に引っかかっている可能性があります。個人の@gmail.comでAPIキーを取り直してみてください。");
                        clearApiKey();
                    } else if (data.error.message.includes("API key not valid")) {
                        alert("APIキーが無効です。設定をリセットしてください。");
                        clearApiKey();
                    } else {
                        alert("AIエラー: " + data.error.message);
                    }
                    return null;
                }
                return data.candidates[0].content.parts[0].text;
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
                alert("通信失敗: " + e.message);
                return null;
            }
        }

        function extractJSON(text) {
            try { return JSON.parse(text.match(/\{[\s\S]*\}/)[0]); } catch (e) { return null; }
        }

        // カメラ（召喚）
        document.getElementById('camera-summon').addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const text = await callGemini([
                    { text: '日常のモノの画像をRPGキャラにしたステータスを作成せよ。必ず以下のJSON形式のみを出力すること。 {"name":"名前","hp":100,"atk":50,"def":50,"desc":"説明"}' },
                    { inlineData: { mimeType: file.type, data: base64 } }
                ]);
                if (text) {
                    const result = extractJSON(text);
                    if (result) { 
                        myData = result; localStorage.setItem("monomon_data", JSON.stringify(myData)); updateHomeUI(); 
                    } else { alert("解析に失敗しました。"); }
                }
                e.target.value = '';
            };
        });

        // カメラ（育成）
        document.getElementById('camera-feed').addEventListener('change', async (e) => {
            if (!myData) return alert("召喚が先です");
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64 = reader.result.split(',')[1];
                const text = await callGemini([
                    { text: '食べ物の画像の成長値を判定せよ。必ず以下のJSON形式のみを出力すること。 {"hp_up":10,"atk_up":5,"def_up":5,"comment":"一言"}' },
                    { inlineData: { mimeType: file.type, data: base64 } }
                ]);
                if (text) {
                    const result = extractJSON(text);
                    if (result) { 
                        myData.hp += result.hp_up; myData.atk += result.atk_up; myData.def += result.def_up; 
                        localStorage.setItem("monomon_data", JSON.stringify(myData)); updateHomeUI(); alert(result.comment); 
                    }
                }
                e.target.value = '';
            };
        });

        // 部屋作成
        window.hostGame = () => {
            if (!myData) return alert("キャラがいません");
            const code = Math.floor(1000 + Math.random() * 9000).toString();
            set(ref(db, 'rooms/' + code), { host: myData });
            document.getElementById('room-display').classList.remove('hidden');
            document.getElementById('current-code').innerText = code;
            onValue(ref(db, 'rooms/' + code + '/guest'), async (snap) => {
                if (snap.val()) {
                    showScreen('screen-battle');
                    const text = await callGemini([{ text: `バトルの実況をせよ。最後に必ず 勝者：〇〇 と書け。P1:${JSON.stringify(myData)}, P2:${JSON.stringify(snap.val())}` }]);
                    if (text) {
                        update(ref(db, 'rooms/' + code), { result: text });
                        document.getElementById('battle-log').innerHTML = text.replace(/\n/g, "<br>");
                    }
                }
            });
        };

        // 部屋参加
        window.joinGame = () => {
            const code = document.getElementById('join-code').value;
            update(ref(db, 'rooms/' + code), { guest: myData });
            showScreen('screen-battle');
            onValue(ref(db, 'rooms/' + code + '/result'), (snap) => {
                if (snap.val()) document.getElementById('battle-log').innerHTML = snap.val().replace(/\n/g, "<br>");
            });
        };
    </script>
</body>
</html>
